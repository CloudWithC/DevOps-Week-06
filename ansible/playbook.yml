---
- name: Configure Application Server
  hosts: local
  become: false

  tasks:
    - name: Install required packages
      apt:
        name:
          - curl
          - nginx
        state: present
        update_cache: yes

    - name: Create application user
      user:
        name: appuser
        state: present

    - name: Start and enable web server
      service:
        name: nginx
        state: started
        enabled: true
