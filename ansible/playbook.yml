---
- name: Configure Application Server
  hosts: local
  become: false

  tasks:
    - name: Install required packages
      apt:
        name:
          - curl
          - nginx
        state: present
        update_cache: yes

    - name: Create application user
      user:
        name: appuser
        state: present

    - name: Start and enable web server
      service:
        name: nginx
        state: started
        enabled: true

    - name: Deploy application page
      copy:
        content: |
          <html>
          <head>
              <title>DevOps Week 6</title>
          </head>
          <body>
              <h1>Application Deployed Successfully!</h1>
              <p>Configured using Terraform and Ansible.</p>
          </body>
          </html>
        dest: /var/www/html/index.html
        mode: '0644'
